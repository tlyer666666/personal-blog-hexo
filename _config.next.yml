# ================================================================
# NexT Theme Settings (site root: _config.next.yml)
# ================================================================

scheme: Gemini
darkmode: true

menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

social:
  GitHub: https://github.com/<你的GitHub用户名> || fab fa-github
  Blog: https://<你的GitHub用户名>.github.io || fa fa-rss

avatar:
  url: /images/avatar.svg
  rounded: true
  rotated: false

footer:
  since: 2026

post_meta:
  item_text: true
  created_at: true
  updated_at: true

codeblock:
  copy_button:
    enable: true
    show_result: true
    style: flat

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

local_search:
  enable: true

creative_commons:
  license: by-nc-sa
  sidebar: false
  post: true

# If an option is not listed, it falls back to the theme default.
